<script>
/* 수학 농장 · 농장 화면 (돌아다니는 동물, 동전, 배치, 상점, 도감, 보관함, 업그레이드)
 * 2026-11-19 동물 위치 기억(농장 고정) 포함 */
var cv = $('farm'), ctx = cv.getContext('2d');

/* ---------- 서버 데이터 → 화면 ---------- */

}
function hud() {

  $('fnext').textContent = state.maxLevel ? '최고 레벨이에요!' : '다음 레벨까지 ' + state.toNext + '차시';
}
function animalPos() { return A.map(function (a) { var c = ctr(a); return { id: a.id, a: 1, x: Math.round(c[0]), y: Math.round(c[1]), f: a.f ? 1 : 0 }; }); }
function layoutList() { return OBJ.map(function (o) { return { id: o.id, k: o.k, x: Math.round(o.x), y: Math.round(o.y) }; }).concat(animalPos()); }

/* ---------- 동물 위치 기억 (나갔다 들어와도 그 자리에) ---------- */
var POS_KEY = 'mf_pos', POS = (function () { try { return JSON.parse(localStorage.getItem(POS_KEY) || '{}') || {}; } catch (e) { return {}; } })();
function savePos() {
  if (!state || !A.length) return;
  var now = Date.now();
  A.forEach(function (a) { var c = ctr(a); POS[a.id] = [Math.round(c[0]), Math.round(c[1]), a.f ? 1 : 0, now]; });
  try { localStorage.setItem(POS_KEY, JSON.stringify(POS)); } catch (e) {}
}
function savedSpot(d) {
  var l = POS[d.id], s = d.p;
  var p = l && (!s || (l[3] || 0) >= (s[3] || 0)) ? l : s;   // 기기 기록과 서버 기록 중 최근 것
  if (!p) return freeSpot();
  return nearSpot(p[0], p[1]).concat([p[2]]);
}
function nearSpot(cx, fy) {
  if (!solidAt(cx, fy)) return [cx, fy];
  for (var r = 4; r <= 120; r += 4) for (var k = 0; k < 16; k++) {
    var an = k / 16 * Math.PI * 2, x = cx + Math.cos(an) * r, y = fy + Math.sin(an) * r * .7;
    if (!solidAt(x, y)) return [x, y];

}
setInterval(savePos, 3000);
document.addEventListener('visibilitychange', function () { if (document.hidden) savePos(); });
window.addEventListener('pagehide', savePos);

/* ---------- 충돌 · 이동 ---------- */
function solidAt(cx, fy, ign) {
  var o = own(); if (cx < o.x + 7 || cx > o.x + o.w - 7 || fy < o.y + 10 || fy > o.y + o.h - 2) return true;

    var d = def(ob), F2 = fps(d);
    for (var j = 0; j < F2.length; j++) { var f = F2[j], rx = ob.x + f[0], ry = ob.y + f[1]; if (bx < rx + f[2] && bx + bw > rx && by < ry + f[3] && by + bh > ry) return true; }
  }

  return false;
}
function pathClear(x0, y0, x1, y1) { var n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3); for (var i = 1; i <= n; i++) if (solidAt(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n)) return false; return true; }
function mkAnimal(t, cx, fy) { var m = sprite(t, false).meta; return { t: t, f: Math.random() < .5, j: 0, dy: 0, ready: true, state: 'idle', until: performance.now() + Math.random() * 2500, x: Math.round(cx - m.W / 2), y: Math.round(fy - m.foot) }; }
function freeSpot(nx, ny) {

}
function ctr(a) { var m = sprite(a.t, false).meta; return [a.x + m.W / 2, a.y + m.foot]; }
function randTarget(a) { var m = sprite(a.t, false).meta, c = ctr(a); for (var i = 0; i < 25; i++) { var cx = c[0] + (Math.random() - .5) * 110, fy = c[1] + (Math.random() - .5) * 70; if (!solidAt(cx, fy) && pathClear(c[0], c[1], cx, fy)) return { x: Math.round(cx - m.W / 2), y: Math.round(fy - m.foot) }; } return null; }

function ofoot(o) { return o.y + def(o).h - 2; }
function step(a, now, dt) {

/* ---------- 카메라 · 확대 축소 ---------- */

window.addEventListener('resize', function () { if (state) fitCanvas(); });
$('zoomBtn').onclick = function () { setView(wide ? DV : MAXV); };
cv.addEventListener('wheel', function (e) { e.preventDefault(); setView(VW * (e.deltaY > 0 ? 1.12 : 1 / 1.12)); }, { passive: false });

/* ---------- 그리기 ---------- */
function coinPos(a, now) { var sp = sprite(a.t, a.f), m = sp.meta, bob = Math.round(Math.sin(now / 300 + a.x * .1)); return { x: Math.round(a.x + m.W / 2 - 4), y: Math.round(a.y) - a.dy + sp.top - 11 + bob }; }
function drawCoin(x, y, hl) { R(x + 1, y + 10, 6, 1, 'rgba(30,60,15,0.25)'); E(x + 4, y + 4, 4.2, 4.2, '#6b4a00'); E(x + 4, y + 4, 3.4, 3.4, hl ? '#ffe066' : '#f5c518'); E(x + 4.5, y + 4.5, 2, 2, hl ? '#ffd23f' : '#e0b010'); R(x + 2, y + 2, 1, 2, '#fff7c0'); R(x + 3, y + 1, 1, 1, '#fff7c0'); R(x + 4, y + 3, 1, 3, '#b8860b'); R(x + 3, y + 3, 3, 1, '#b8860b'); }
var act = $('act');

  A.forEach(function (a) { step(a, now, dt); });

  ctx.fillStyle = '#4f8532'; ctx.fillRect(0, 0, VW, VH); ctx.drawImage(wild, -cx, -cy);
  ctx.save(); ctx.translate(-cx, -cy);
  var o = own();
  ctx.save(); ctx.beginPath(); ctx.rect(o.x, o.y, o.w, o.h); ctx.clip(); ctx.drawImage(grass, 0, 0); ctx.restore();
  R(o.x - 1, o.y - 1, o.w + 2, 1, '#4a7a2a'); R(o.x - 1, o.y + o.h, o.w + 2, 1, '#4a7a2a'); R(o.x - 1, o.y, 1, o.h, '#4a7a2a'); R(o.x + o.w, o.y, 1, o.h, '#4a7a2a');
  for (var x = o.x; x < o.x + o.w; x += 9) { R(x, o.y - 2, 2, 2, '#a3acb3'); R(x + 4, o.y + o.h, 2, 2, '#a3acb3'); }
  for (var y = o.y; y < o.y + o.h; y += 9) { R(o.x - 2, y, 2, 2, '#a3acb3'); R(o.x + o.w, y + 4, 2, 2, '#a3acb3'); }
  if (flash > now) { var al = (flash - now) / 1200; ctx.fillStyle = 'rgba(255,250,200,' + (.45 * al) + ')'; ctx.fillRect(o.x, o.y, o.w, o.h); }
  OBJ.filter(function (b) { return def(b).flat; }).forEach(function (b) { ctx.drawImage(frame(def(b), now), Math.round(b.x), Math.round(b.y)); });
  if (typeof drawGarden === 'function') drawGarden(now);   // 텃밭 (extras)
  var list = [];
  OBJ.forEach(function (b) { if (!def(b).flat) list.push({ o: b, f: ofoot(b) }); });
  A.forEach(function (a) { list.push({ a: a, f: foot(a) }); });
  list.sort(function (p, q) { return p.f - q.f; });
  list.forEach(function (it) {
    if (it.o) { ctx.drawImage(frame(def(it.o), now), Math.round(it.o.x), Math.round(it.o.y)); return; }
    var a = it.a, sp = sprite(a.t, a.f), m = sp.meta, lift = 0, px = Math.round(a.x), py = Math.round(a.y);
    if (a.j) { var p = (now - a.j) / 350; if (p >= 1) a.j = 0; else lift = Math.round(Math.sin(p * Math.PI) * 5); }
    if (drag && drag.a === a && drag.moved) lift = 3;
    var bob = (a.state === 'walk' && mode === 'play' && !m.fly && Math.floor(now / 170) % 2) ? 1 : 0;
    a.dy = lift + (m.fly || 0) + bob;
    E(px + m.W / 2, py + m.foot, m.rx - lift * .6, m.ry, m.fly ? 'rgba(30,60,15,0.22)' : SH);
    ctx.drawImage(sp.c, px, py - a.dy);
    if (mode === 'edit' && a === selA) { ctx.save(); ctx.strokeStyle = '#fff'; ctx.setLineDash([2, 2]); ctx.strokeRect(px + .5, py - a.dy + .5, m.W - 1, m.H - 1); ctx.restore(); }
  });
  if (mode === 'play') A.forEach(function (a) { if (a.ready) { var c = coinPos(a, now); drawCoin(c.x, c.y, a === hoverCoin); } });
  if (mode === 'edit') {
    OBJ.forEach(function (b) {
      var d = def(b); ctx.save(); ctx.strokeStyle = b === sel ? '#fff' : 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
      ctx.lineDashOffset = -Math.floor(now / 120) % 4; ctx.strokeRect(Math.round(b.x) + .5, Math.round(b.y) + .5, d.w - 1, d.h - 1); ctx.restore();
    });
  }
  ctx.restore();
  placeAct();
  if (menu.style.display === 'grid' && menuObj) placeMenu();
  placeBadge();
  requestAnimationFrame(draw);
}
function placeAct() {
  if (mode === 'edit' && !drag && (sel && sel.k !== 'barn' || selA)) {
    act.style.display = 'flex';
    var bx, by, bw, bh;
    if (sel) {
      var d = def(sel);
      $('aSell').style.display = d.special ? 'none' : '';
      $('aRot').style.display = d.rot ? '' : 'none';
      $('aSell').innerHTML = '<i class="ti ti-coin" aria-hidden="true"></i> 판매 +' + fmt(Math.floor(d.price / 2));
      $('aStore').innerHTML = '<i class="ti ti-box" aria-hidden="true"></i> 보관';
      bx = sel.x; by = sel.y; bw = d.w; bh = d.h;
    } else {
      var m = sprite(selA.t, selA.f).meta;
      $('aSell').style.display = 'none'; $('aRot').style.display = 'none';
      $('aStore').innerHTML = '<i class="ti ti-box" aria-hidden="true"></i> 보관함으로';

    var below = by - cam.y + bh + 3;

}

/* ---------- 누르기 · 끌기 ---------- */
function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * VW / r.width + cam.x, y: (e.clientY - r.top) * VH / r.height + cam.y }; }
function sx(x) { return (x - cam.x) / VW * 100 + '%'; }
function sy(y) { return (y - cam.y) / VH * 100 + '%'; }
function hitCoin(p) { if (mode !== 'play') return null; var now = performance.now(), best = null; A.forEach(function (a) { if (!a.ready) return; var c = coinPos(a, now); if (p.x >= c.x - 4 && p.x <= c.x + 12 && p.y >= c.y - 4 && p.y <= c.y + 12) best = a; }); return best; }

    var a = list[i], sp = sprite(a.t, a.f), W = sp.meta.W, H = sp.meta.H, qx = Math.floor(p.x - Math.round(a.x)), qy = Math.floor(p.y - (Math.round(a.y) - a.dy));

  }

}
function hitO(p) {

}
var wrapEl = $('farmView');
function collect(a) {

  f.className = 'flt'; f.textContent = '+' + amt; f.style.left = sx(c.x + 4); f.style.top = sy(c.y + 6); wrapEl.appendChild(f);
  requestAnimationFrame(function () { requestAnimationFrame(function () { f.style.transform = 'translate(-50%,-220%)'; f.style.opacity = '0'; }); });
  setTimeout(function () { f.remove(); }, 950);

}
/* 여러 마리를 빠르게 누르면 모아서 한 번에 저장해요 */
var collectQ = [], collectT = null;

  var batch = collectQ; collectQ = [];
  if (!batch.length) return;

    pendingCollect--;

  }).catch(function () {

}

var menu = $('menu');

function placeMenu() { var d = def(menuObj); menu.style.left = Math.min(Math.max((menuObj.x - cam.x + d.w / 2) / VW * 100, 18), 82) + '%'; menu.style.top = (Math.max(8, Math.min(menuObj.y - cam.y + d.h * .45, VH - 80)) / VH * 100) + '%'; }

  drag = { pan: 1, sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false, tap: hitO(p), plot: typeof hitGarden === 'function' ? hitGarden(p) : -1 };
});

  var p = pos(e);
  if (!drag) { var b = hitO(p), cn = hitCoin(p); hoverCoin = cn; cv.style.cursor = mode === 'edit' ? (b ? 'move' : (hitA(p) ? 'pointer' : 'grab')) : (cn || hitA(p) || (b && b.k === 'barn') || (typeof hitGarden === 'function' && hitGarden(p) >= 0) ? 'pointer' : 'grab'); return; }
