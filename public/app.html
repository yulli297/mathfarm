<script>
/* 수학 농장 · 공통 (서버 부르기, 알림, 창, 첫 화면) */
var CF = null, ME = null, QUIZ = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nm(t) { return CF.NAMES[t] || t; }
function fmt(n) { return Number(n || 0).toLocaleString(); }
/* 받침에 따라 이/가 */
function iga(w) { var c = String(w).charCodeAt(String(w).length - 1) - 0xAC00; return (c >= 0 && c <= 11171 && c % 28) ? '이' : '가'; }

/* 서버 함수 부르기 → Promise */
var busyN = 0;
function busy(d) { busyN = Math.max(0, busyN + d); $('busy').classList.toggle('show', busyN > 0); }
/* 서버 부르기는 한 줄로 차례차례 보내요 (먼저 누른 것이 먼저 저장) */
var srvChain = Promise.resolve();
function srv(fn) {
  var args = [].slice.call(arguments, 1);
  if (fn !== 'api_collect' && typeof collectQ !== 'undefined' && collectQ.length) { clearTimeout(collectT); flushCollect(); }
  busy(1);
  var p = srvChain.then(function () {
    return new Promise(function (res, rej) {
      google.script.run
        .withSuccessHandler(function (r) { res(r); })
        .withFailureHandler(function (e) { rej(new Error(errMsg(e))); })[fn].apply(null, args);
    });
  });
  srvChain = p.then(function () {}, function () {});
  return p.then(function (r) { busy(-1); return r; }, function (e) { busy(-1); toast(e.message); throw e; });
}
function errMsg(e) {
  var m = String(e && e.message || e || '문제가 생겼어요.');
  m = m.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');
  if (/NOT_REGISTERED|NO_EMAIL/.test(m)) return '로그인 정보를 확인할 수 없어요. 새로고침해 주세요.';
  if (/Lock|lock|timed out|시간/.test(m)) return '친구들이 한꺼번에 저장하고 있어요. 잠시 뒤에 다시 눌러 주세요.';
  return m;
}

var toastT;
function toast(m) {
  var t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* 창 */
function openModal(html) {
  $('mbox').innerHTML = html;
  $('modal').classList.add('show');
  var x = $('mbox').querySelector('.x');
  if (x) x.onclick = closeModal;
}
function closeModal() { $('modal').classList.remove('show'); $('mbox').innerHTML = ''; }
$('modal').addEventListener('pointerdown', function (e) { if (e.target === $('modal')) closeModal(); });
function head(icon, t) {
  return '<h3><span><i class="ti ' + icon + '" aria-hidden="true"></i> ' + t + '</span><button class="x" aria-label="닫기"><i class="ti ti-x"></i></button></h3>';
}

/* 그림 아이콘 */
function scaled(src, w, h, maxW, maxH, maxS) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(src, 0, 0);
  var s = Math.min(maxS || 2, maxW / w, maxH / h);
  c.style.width = Math.round(w * s) + 'px'; c.style.height = Math.round(h * s) + 'px';
  return c;
}
function itemIcon(k, an) {
  var it = ITEMS[k];
  if (it.statue) return scaled(statueCanvas(an || 'cow'), it.w, it.h, 64, 56);
  return scaled(it.frames ? it.frames[0] : it.c, it.w, it.h, 64, 56);
}
function animalIcon(t, sil, size) {
  var sp = sprite(t, false), W = sp.meta.W, H = sp.meta.H, c = document.createElement('canvas');
  c.width = W; c.height = H;
  var x = c.getContext('2d'); x.drawImage(sp.c, 0, 0);
  if (sil) { x.globalCompositeOperation = 'source-in'; x.fillStyle = '#8a7a62'; x.fillRect(0, 0, W, H); }
  var s = (size || 56) / W;
  c.style.width = Math.round(W * s) + 'px'; c.style.height = Math.round(H * s) + 'px';
  return c;
}
function rarity(t) {
  if (CF.ANIMALS.l.indexOf(t) >= 0) return ['l', '전설'];
  if (CF.ANIMALS.g.indexOf(t) >= 0) return ['s', '황금'];
  if (CF.ANIMALS.t.indexOf(t) >= 0) return ['', '사고력'];
  if (CF.ANIMALS.m.indexOf(t) >= 0) return ['', '기본'];
  return ['', '기초'];
}

/* 동물마다 그날 받을 골드 (서버와 같은 계산) */
function payClassC(t) {
  var A = CF.ANIMALS;
  if (A.b.indexOf(t) >= 0) return 'b';
  if (A.m.indexOf(t) >= 0) return 'm';
  if (A.t.indexOf(t) >= 0) return 't';
  return 's';
}
function dailyAmount(t, id, day) {
  var r = CF.PAY[payClassC(t)], s = id + '|' + day, h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return r[0] + (Math.abs(h) % (r[1] - r[0] + 1));
}

/* ---------- 시작 ---------- */
function start() {
  if (BOOT.error) { showError(BOOT.error); return; }
  CF = BOOT.cfg; ME = BOOT.me; QUIZ = BOOT.quiz;
  applyCfg();
  initFarm(BOOT.farm);
  if (ME.teacher) {
    $('teacherBtn').classList.remove('hide');
    openTeacher();
  } else {
    enterFarm();
  }
}

function enterFarm() {
  $('farmView').classList.remove('hide');
  fitCanvas();
  if (!state.introDone) showIntro();
}

function showError(code) {
  var box = $('fullBox'), html;
  if (code === 'NO_EMAIL') {
    html = '<h3 style="margin-top:0"><i class="ti ti-user-question" aria-hidden="true"></i> 구글 계정을 확인할 수 없어요</h3>' +
      '<p>학교 구글 계정으로 로그인했는지 확인해 주세요.</p>' +
      '<p class="muted">선생님께: 웹 앱을 <b>학교 계정</b>으로 배포하고, 실행 권한은 "나", 액세스 권한은 "도메인 내 모든 사용자"로 설정했는지 확인해 주세요.</p>';
  } else if (/^NOT_REGISTERED:/.test(code)) {
    html = '<h3 style="margin-top:0"><i class="ti ti-user-x" aria-hidden="true"></i> 등록되지 않은 계정이에요</h3>' +
      '<p>선생님께 아래 계정을 알려 주세요.</p><div class="card" style="font-size:16px">' + esc(code.split(':').slice(1).join(':')) + '</div>' +
      '<p class="muted">선생님께: 구글 시트 [학생명단] 탭에 이 계정을 넣고 새로고침하면 바로 들어올 수 있어요.</p>';
  } else {
    html = '<h3 style="margin-top:0"><i class="ti ti-alert-triangle" aria-hidden="true"></i> 농장을 열 수 없어요</h3><div class="card">' + esc(code).replace(/\n/g, '<br>') + '</div>';
  }
  box.innerHTML = html + '<div style="text-align:right"><button class="pbtn" onclick="location.reload()"><i class="ti ti-refresh" aria-hidden="true"></i> 새로고침</button></div>';
  $('full').classList.remove('hide');
}

/* ---------- 처음 안내 ---------- */
var INTRO = [
  ['ti-pencil', '수업이 끝나면 문제를 풀어요', '그날 배운 내용으로 10문제를 풀어요. 틀려도 힌트를 보고 다시 도전할 수 있어요. 문제를 풀면 새 동물 친구를 만날 수 있어요.'],
  ['ti-paw', '동물은 두 마리 중에 골라요', '1~4번 중 {n}문제, 5~7번 중 {n}문제 이상 맞히면 기초 동물과 기본 동물이 나와요. 두 마리 중에 마음에 드는 한 마리를 고르면 내 농장에 들어와요. 좋아하는 동물로만 농장을 채워도 돼요.'],
  ['ti-coin', '머리 위 동전을 눌러요', '동물 머리 위에 동전이 보이면 눌러서 골드를 받아요. 동물마다 하루에 한 번씩 받을 수 있고, 다음 날이 되면 다시 생겨요. 보관함에 있는 동물은 골드를 주지 않아요.'],
  ['ti-hammer', '골드로 농장을 키워요', '농장 건물을 누르면 상점, 도감, 보관함, 건물 업그레이드가 있어요. 건물을 업그레이드하면 땅이 넓어지고 동물을 더 키울 수 있어요. 나무, 울타리, 길 같은 꾸미기 물건도 살 수 있어요.'],
  ['ti-star', '특별한 동물을 찾아요', '8~10번은 기본 문제와 사고력 문제 중에 고를 수 있어요. 사고력 문제를 맞힐 때마다 동물을 만나고, 황금 동물이나 전설의 동물이 나타날 수도 있어요. 도감을 가득 채워 보세요!']
];
var introI = 0;
function showIntro() {
  introI = 0;
  var hero = document.createElement('canvas'); hero.width = 44; hero.height = 38;
  var hx = hero.getContext('2d'); hx.fillStyle = '#8fcf5a'; hx.fillRect(0, 0, 44, 38); hx.drawImage(BARN[0].c, 0, 0);
  $('fullBox').innerHTML =
    '<div class="introTop"><i class="ti ti-user-check" aria-hidden="true"></i><span><b>' + esc(ME.name) + '</b>' + (ME.teacher ? '' : ' 님') + ', 환영해요. 구글 계정으로 자동 로그인됐어요</span></div>' +
    '<div class="hero" id="heroBox"></div>' +
    '<p class="fnm">' + esc(state.name) + '</p><div class="fsub">내 농장이에요. 이름은 왼쪽 위 이름판을 눌러 바꿀 수 있어요</div>' +
    '<div class="pg"><h4 id="ipt"></h4><p id="ipp"></p></div><div class="dots" id="idots"></div>' +
    '<div class="rowb"><button class="pbtn w" id="ibp">이전</button><span class="muted" id="ipn"></span><button class="pbtn g" id="ibn">다음</button></div>';
  $('heroBox').appendChild(hero);
  $('full').classList.remove('hide');
  $('ibp').onclick = function () { if (introI > 0) { introI--; introRender(); } };
  $('ibn').onclick = function () {
    if (introI < INTRO.length - 1) { introI++; introRender(); return; }
    $('full').classList.add('hide');
    state.introDone = true;
    srv('api_finishIntro').catch(function () {});
    if (hasQuiz()) note('농장 건물 위 "오늘의 문제"를 눌러 시작해요');
  };
  introRender();
}
function introRender() {
  var p = INTRO[introI];
  $('ipt').innerHTML = '<i class="ti ' + p[0] + '" aria-hidden="true"></i> ' + p[1];
  $('ipp').textContent = p[2].replace(/\{n\}/g, CF.ZONE_NEED);
  var d = ''; for (var k = 0; k < INTRO.length; k++) d += '<i class="' + (k === introI ? 'on' : '') + '"></i>';
  $('idots').innerHTML = d;
  $('ibp').disabled = introI === 0;
  $('ipn').textContent = (introI + 1) + ' / ' + INTRO.length;
  $('ibn').innerHTML = introI === INTRO.length - 1 ? '<i class="ti ti-check" aria-hidden="true"></i> 농장 시작하기' : '다음';
}
</script>
