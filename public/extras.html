<script>
/* 수학 농장 · 추가 기능
 *  1) 사고력 3문제 모두 한 번에 맞히면 농장 최대 마릿수 +1 (화면 표시)
 *  2) 레벨업 보상 골드 안내
 *  3) 교사 화면 '농장 초기화' 탭
 *  4) 텃밭 (실과 · 친환경 농업): 작물 심기, 수확, 텃밭 사건, 땅 살리기, 작물 창고·먹이 주기, 작물 도감, 친환경 온실
 * 이 파일은 farm / quiz / teacher 다음에 불러와서, 필요한 함수만 덧씌워요.
 */

/* ---------- 최대 마릿수 = 건물 기본 + 사고력 보너스 ---------- */
var _applyFarmBase = applyFarm;
applyFarm = function (f) {
  if (f && CF) {
    var bonus = f.capBonus | 0;
    CF.BARN.forEach(function (b, i) { if (BARN[i]) BARN[i].cap = b.cap + bonus; });
  }
  return _applyFarmBase(f);
};

/* ---------- 처음 안내 ---------- */
INTRO[4][2] += ' 사고력 문제 3개를 모두 한 번에 맞히면 농장 최대 마릿수가 1마리 늘어나요. 농장 레벨이 오를 때마다 {lg}골드도 받아요!';
var _introRenderBase = introRender;
introRender = function () {
  _introRenderBase();
  var p = $('ipp'); if (p) p.textContent = p.textContent.replace(/\{lg\}/g, fmt(CF.LEVEL_GOLD));
};

/* ---------- 문제 풀기 화면 ---------- */
var _progHtmlBase = progHtml;
progHtml = function (v) {
  var h = _progHtmlBase(v);
  if (v.choice === 'adv') h = h.replace('8~10번 사고력: 맞힐 때마다 동물', '8~10번 사고력: 맞힐 때마다 동물 · 3문제 모두 한 번에 맞히면 최대 마릿수 +' + CF.ADV_CAP_BONUS);
  return h;
};

var _renderChooseBase = renderChoose;
renderChoose = function () {
  _renderChooseBase();
  var o = $('cAdv'); if (!o) return;
  var p = o.querySelector('p');
  if (p) p.insertAdjacentHTML('beforeend', '<br><b>3문제를 모두 한 번에 맞히면</b> 농장 최대 마릿수가 <b>+' + CF.ADV_CAP_BONUS + '</b> 늘어나요!');
};

var _showResultBase = showResult;
showResult = function (res) {
  _showResultBase(res);
  var card = $('qbox').querySelector('.qcard.done'); if (!card) return;
  var add = '';
  if (res.capUp) add += '<div class="lvup"><i class="ti ti-paw" aria-hidden="true"></i> 사고력 3문제 한 번에 성공! 농장 최대 마릿수 +' + res.capUp + ' (지금 ' + res.cap + '마리까지)</div>';
  if (res.levelGold) add += '<div class="lvup"><i class="ti ti-coin" aria-hidden="true"></i> 레벨업 보상 ' + fmt(res.levelGold) + '골드를 받았어요!</div>';
  if (add && card.lastElementChild) card.lastElementChild.insertAdjacentHTML('beforebegin', add);
};

/* ---------- 교사 화면: 농장 초기화 탭 ---------- */
var tResetSel = {}, tResetLog = true;

renderTeacher = function () {
  var d = TD, open = d.lessons.filter(function (l) { return l.id === d.open; })[0];
  if (!tLesson) tLesson = d.open || (d.lessons[0] && d.lessons[0].id) || '';
  var tabs = [['lesson', 'ti-calendar', '수업 설정'], ['students', 'ti-users', '학생 현황'], ['acc', 'ti-table', '차시별 정답률'], ['concept', 'ti-chart-bar', '개념별 정답률'], ['reset', 'ti-trash', '농장 초기화'], ['tools', 'ti-tool', '체험 도구']];
  var html = '<div class="thead"><h2><i class="ti ti-school" aria-hidden="true"></i> 선생님 화면</h2>' +
    '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="muted">오늘 열린 차시: <b>' + (open ? esc(open.title) : '없음') + '</b></span>' +
    '<button class="pbtn w" onclick="openTeacher()"><i class="ti ti-refresh" aria-hidden="true"></i> 새로고침</button>' +
    '<button class="pbtn g" onclick="closeTeacher()"><i class="ti ti-plant" aria-hidden="true"></i> 학생 화면 체험 (내 농장)</button></div></div>' +
    '<div class="tabs">' + tabs.map(function (t) { return '<button class="pbtn w' + (tTab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '"><i class="ti ' + t[1] + '" aria-hidden="true"></i> ' + t[2] + '</button>'; }).join('') + '</div><div id="tbody"></div>';
  $('tbox').innerHTML = html;
  [].forEach.call($('tbox').querySelectorAll('[data-tab]'), function (b) { b.onclick = function () { tTab = b.getAttribute('data-tab'); renderTeacher(); }; });
  ({ lesson: tLessonTab, students: tStudentsTab, acc: tAccTab, concept: tConceptTab, reset: tResetTab, tools: tToolsTab })[tTab]();
};

function tResetTab() {
  var rows = TD.students.map(function (s, i) {
    if (!s.joined) return '<tr><td></td><td>' + esc(s.no) + '</td><td class="l">' + esc(s.name) + '</td><td colspan="4" class="muted">아직 접속하지 않았어요 (지울 데이터 없음)</td></tr>';
    return '<tr><td><input type="checkbox" data-r="' + i + '"' + (tResetSel[s.email] ? ' checked' : '') + ' aria-label="' + esc(s.name) + ' 선택"></td><td>' + esc(s.no) + '</td><td class="l">' + esc(s.name) + '</td><td class="l">' + esc(s.farmName) + '</td><td>Lv.' + s.level + '</td><td>' + (Object.keys(s.done).length) + '</td><td><span class="coin"></span> ' + fmt(s.gold) + '</td></tr>';
  }).join('');
  $('tbody').innerHTML =
    '<div class="card wood" style="display:block"><div style="font-weight:600;margin-bottom:6px"><i class="ti ti-alert-triangle" aria-hidden="true"></i> 학생 농장 초기화</div>' +
    '<div class="muted" style="margin-bottom:8px">연습으로 쌓인 데이터를 지우고 학생 농장을 <b>처음 상태</b>로 돌려요. 동물, 골드, 레벨, 꾸민 물건, 푼 차시 기록이 모두 사라지고 <b>되돌릴 수 없어요</b>. 학생이 다시 들어오면 새 농장과 처음 안내가 나와요. 선생님 본인 농장은 그대로예요(‘체험 도구’에서 따로 초기화).</div>' +
    '<label style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" id="rLog"' + (tResetLog ? ' checked' : '') + '> 풀이 기록(정답률 통계)도 함께 지우기</label>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pbtn red" id="rSome"><i class="ti ti-trash" aria-hidden="true"></i> 선택한 학생 초기화 (<span id="rCnt">0</span>명)</button>' +
    '<button class="pbtn red" id="rAll"><i class="ti ti-alert-triangle" aria-hidden="true"></i> 전체 학생 초기화</button></div></div>' +
    '<div class="tscroll"><table class="tbl"><thead><tr><th><input type="checkbox" id="rAllChk" aria-label="모두 선택"></th><th>번호</th><th>이름</th><th>농장 이름</th><th>레벨</th><th>푼 차시</th><th>골드</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  function count() {
    var n = 0; TD.students.forEach(function (s) { if (s.joined && tResetSel[s.email]) n++; });
    $('rCnt').textContent = n; $('rSome').disabled = !n;
  }
  [].forEach.call($('tbody').querySelectorAll('[data-r]'), function (c) {
    c.onchange = function () { var s = TD.students[+c.getAttribute('data-r')]; if (c.checked) tResetSel[s.email] = 1; else delete tResetSel[s.email]; count(); };
  });
  $('rAllChk').onchange = function () {
    var on = this.checked;
    TD.students.forEach(function (s) { if (s.joined) { if (on) tResetSel[s.email] = 1; else delete tResetSel[s.email]; } });
    [].forEach.call($('tbody').querySelectorAll('[data-r]'), function (c) { c.checked = on; });
    count();
  };
  $('rLog').onchange = function () { tResetLog = this.checked; };
  $('rSome').onclick = function () {
    var list = TD.students.filter(function (s) { return s.joined && tResetSel[s.email]; });
    if (list.length) confirmReset(list.map(function (s) { return s.email; }), list.length + '명 (' + list.map(function (s) { return s.name; }).join(', ') + ')');
  };
  $('rAll').onclick = function () { confirmReset('ALL', '접속한 모든 학생'); };
  count();
}

function confirmReset(target, label) {
  openModal(head('ti-alert-triangle', '정말 초기화할까요?') +
    '<p><b>' + esc(label) + '</b>의 농장을 처음 상태로 돌려요.' + (tResetLog ? ' 풀이 기록도 함께 지워요.' : ' 풀이 기록은 남겨 둬요.') + '</p>' +
    '<p class="muted">동물, 골드, 레벨, 꾸민 물건이 모두 사라지고 되돌릴 수 없어요.</p>' +
    '<div style="display:flex;gap:6px;justify-content:flex-end"><button class="pbtn w" id="rNo">취소</button><button class="pbtn red" id="rYes"><i class="ti ti-trash" aria-hidden="true"></i> 초기화하기</button></div><div class="err" id="rErr"></div>');
  $('rNo').onclick = closeModal;
  $('rYes').onclick = function () {
    $('rYes').disabled = true;
    srv('api_resetFarms', target, !!tResetLog).then(function (r) {
      TD = r; tResetSel = {}; closeModal();
      var i = r.resetInfo || {};
      toast('농장 ' + (i.farms || 0) + '개를 초기화했어요' + (tResetLog ? ' (풀이 기록 ' + (i.logs || 0) + '줄 삭제)' : ''));
      renderTeacher();
    }).catch(function (e) { $('rYes').disabled = false; $('rErr').textContent = e.message; });
  };
}

/* =====================================================================
 * 텃밭 (실과 · 친환경 농업)
 *  - 건물 옆 텃밭 칸을 누르면 텃밭 창이 열려요 (건물 메뉴의 '텃밭 · 작물 창고' 버튼도 있어요)
 *  - 농장 하루 = 선생님이 새 차시를 여는 순간
 * ===================================================================== */

/* ---------- 작물 도트 그림 (16 x 16) ---------- */
var CROP_DRAW = {
  rice: function () { [2, 6, 10].forEach(function (x) { LN(x, 15, x + 1, 6, '#8fae3e'); LN(x + 1, 15, x + 2, 7, '#a7c24e'); E(x + 2.5, 5.5, 1.7, 3.2, '#e8c23a'); E(x + 3.2, 7, 1, 1.8, '#c9971c'); R(x + 2, 2, 1, 1, '#f5dc6a'); }); },
  cabbage: function () { E(8, 10, 7, 5.5, '#4f9a32'); E(8, 9.5, 5.6, 4.6, '#7cc24a'); E(8, 9, 3.8, 3.3, '#b6e07a'); E(8, 8.5, 2, 1.8, '#e3f4b8'); LN(4, 12, 7, 9, '#3f7f28'); LN(12, 12, 9, 9, '#3f7f28'); },
  carrot: function () { LN(8, 5, 5, 1, '#4caf3a'); LN(8, 5, 8, 0, '#5fc24a'); LN(8, 5, 11, 1, '#4caf3a'); for (var y = 5; y < 16; y++) { var w = Math.max(1, Math.round(6 * (1 - (y - 5) / 11))); R(8 - w / 2, y, w, 1, '#f08a24'); } R(6, 8, 2, 1, '#c96a12'); R(8, 11, 2, 1, '#c96a12'); R(6, 6, 1, 3, '#ffb05a'); },
  corn: function () { E(8, 9, 4.6, 6.6, '#6fb23c'); E(8, 8, 2.8, 5.6, '#f5d33a'); for (var y = 4; y <= 12; y += 2) { R(7, y, 1, 1, '#d9a91a'); R(9, y + 1, 1, 1, '#d9a91a'); } LN(4, 15, 7, 7, '#4f9a2e'); LN(12, 15, 9, 7, '#4f9a2e'); R(8, 1, 1, 2, '#b98a4a'); },
  tomato: function () { E(8, 10, 5.8, 5.2, '#e5402e'); E(8.5, 11, 5, 4, '#d63426'); E(6, 8.5, 1.6, 1.2, '#ff9a80'); R(6, 5, 5, 1, '#3f9a3a'); R(8, 3, 1, 3, '#3f9a3a'); R(5, 6, 1, 1, '#3f9a3a'); R(11, 6, 1, 1, '#3f9a3a'); },
  basil: function () { R(8, 7, 1, 8, '#4a8f30'); E(5, 7, 2.8, 1.9, '#3f9a3a'); E(12, 7, 2.8, 1.9, '#3f9a3a'); E(5, 11, 2.5, 1.7, '#4caf3a'); E(12, 11, 2.5, 1.7, '#4caf3a'); E(8.5, 4, 2, 2.6, '#5fc24a'); R(4, 7, 2, 1, '#6fd25a'); R(11, 7, 2, 1, '#6fd25a'); },
  scallion: function () { [4, 7, 10].forEach(function (x, i) { R(x, 1 + i, 2, 8 - i, '#4caf3a'); R(x, 1 + i, 1, 1, '#6fd25a'); R(x, 9, 2, 5, '#f4f2e6'); R(x + 1, 9, 1, 5, '#d9d4be'); }); R(3, 14, 10, 1, '#c9b48a'); },
  bean: function () { [[4, 12], [6, 10], [8, 8], [10, 6], [12, 4]].forEach(function (c) { E(c[0], c[1], 2.5, 2.5, '#4f9a32'); }); [[4, 12], [6.5, 9.5], [9, 7], [11.5, 4.5]].forEach(function (c) { E(c[0], c[1], 1.3, 1.3, '#86c75a'); }); LN(12, 4, 14, 1, '#3f7f28'); }
};
var CROP_C = {};
function cropIcon(k) {
  if (!CROP_C[k]) CROP_C[k] = off(16, 16, CROP_DRAW[k] || CROP_DRAW.bean);
  return CROP_C[k];
}
function cropImg(k, size, sil) {
  var src = cropIcon(k), c = document.createElement('canvas'); c.width = 16; c.height = 16;
  var x = c.getContext('2d'); x.drawImage(src, 0, 0);
  if (sil) { x.globalCompositeOperation = 'source-in'; x.fillStyle = '#8a7a62'; x.fillRect(0, 0, 16, 16); }
  c.style.width = c.style.height = (size || 40) + 'px'; c.style.imageRendering = 'pixelated';
  return c;
}

/* ---------- 텃밭 땅 그림 (26 x 18) ---------- */
var PW = 26, PH = 18, PGAP = 3;
var PLOT_C = {
  soil: off(PW, PH, function () { R(0, 0, PW, PH, '#8b5a2b'); R(1, 1, PW - 2, PH - 2, '#6b4423'); for (var y = 3; y < PH - 2; y += 4) { R(2, y, PW - 4, 2, '#54341a'); R(2, y - 1, PW - 4, 1, '#7f5530'); } }),
  tired: off(PW, PH, function () { R(0, 0, PW, PH, '#8b7a62'); R(1, 1, PW - 2, PH - 2, '#a89a80'); LN(4, 4, 9, 9, '#7c6c56'); LN(9, 9, 7, 14, '#7c6c56'); LN(15, 3, 19, 8, '#7c6c56'); LN(19, 8, 22, 12, '#7c6c56'); LN(12, 10, 17, 13, '#7c6c56'); }),
  rest: off(PW, PH, function () { R(0, 0, PW, PH, '#8b5a2b'); R(1, 1, PW - 2, PH - 2, '#6b4423'); for (var y = 3; y < PH - 2; y += 4) R(2, y, PW - 4, 2, '#54341a'); [[4, 4], [9, 8], [15, 4], [20, 9], [6, 12], [13, 13], [19, 14]].forEach(function (p) { R(p[0], p[1], 1, 1, '#5fa83a'); R(p[0] + 1, p[1] - 1, 1, 1, '#7cc24a'); }); }),
  sprout: off(PW, PH, function () { [5, 12, 19].forEach(function (x) { [5, 11].forEach(function (y) { R(x, y, 1, 3, '#4caf3a'); R(x - 1, y - 1, 1, 1, '#6fd25a'); R(x + 1, y - 1, 1, 1, '#6fd25a'); }); }); })
};

/* ---------- 텃밭 위치 (건물 오른쪽, 자리가 없으면 왼쪽) ---------- */
function gardenRects() {
  if (!state || !state.g) return [];
  var b = OBJ.filter(function (o) { return o.k === 'barn'; })[0]; if (!b) return [];
  var d = def(b), o = own(), n = state.g.plots.length, tw = n * PW + (n - 1) * PGAP;
  var x0 = b.x + d.w + 5, y0 = b.y + d.h - PH;
  if (x0 + tw > o.x + o.w - 6) x0 = b.x - 5 - tw;
  x0 = Math.round(Math.max(o.x + 6, Math.min(o.x + o.w - 6 - tw, x0)));
  y0 = Math.round(Math.max(o.y + 16, Math.min(o.y + o.h - PH - 4, y0)));
  var out = [];
  for (var i = 0; i < n; i++) out.push({ x: x0 + i * (PW + PGAP), y: y0, w: PW, h: PH });
  return out;
}
function gardenSolid(bx, by, bw, bh) {
  var rs = gardenRects();
  for (var i = 0; i < rs.length; i++) { var r = rs[i]; if (bx < r.x + r.w && bx + bw > r.x && by < r.y + r.h && by + bh > r.y + 3) return true; }
  return false;
}
function hitGarden(p) {
  if (mode !== 'play') return -1;
  var rs = gardenRects();
  for (var i = 0; i < rs.length; i++) { var r = rs[i]; if (p.x >= r.x - 1 && p.x < r.x + r.w + 1 && p.y >= r.y - 10 && p.y < r.y + r.h + 1) return i; }
  return -1;
}
function drawGarden(now) {
  var rs = gardenRects(); if (!rs.length) return;
  var bob = Math.round(Math.sin(now / 260)) - 1;
  rs.forEach(function (r, i) {
    var pl = state.g.plots[i], st = pl.st;
    E(r.x + r.w / 2, r.y + r.h, r.w / 2 + 1, 2, SH);
    ctx.drawImage(st === 'tired' || st === 'heal' ? PLOT_C.tired : st === 'rest' ? PLOT_C.rest : PLOT_C.soil, r.x, r.y);
    if (st === 'grow') ctx.drawImage(PLOT_C.sprout, r.x, r.y);
    if (st === 'grow' && CF.GARDEN.CROPS[pl.c] && CF.GARDEN.CROPS[pl.c].side) { R(r.x + r.w - 6, r.y + 2, 4, 4, '#fff8e1'); ctx.drawImage(cropIcon(pl.c), 0, 0, 16, 16, r.x + r.w - 6, r.y + 2, 4, 4); }
    if (st === 'ready') {
      ctx.drawImage(cropIcon(pl.c), r.x + 1, r.y - 4);
      ctx.drawImage(cropIcon(pl.c), r.x + 9, r.y - 2);
      // 반짝이는 별 = 수확할 수 있어요
      var sx0 = r.x + r.w / 2, sy0 = r.y - 12 + bob;
      R(sx0 - 1, sy0 - 3, 2, 7, '#ffd23f'); R(sx0 - 4, sy0, 8, 1, '#ffd23f'); R(sx0 - 2, sy0 - 1, 4, 3, '#fff3a0');
    }
    if (st === 'empty') { var ex = r.x + r.w / 2, ey = r.y - 6 + bob; R(ex - 3, ey - 3, 7, 7, 'rgba(255,248,225,0.85)'); R(ex - 2, ey, 5, 1, '#3f7a24'); R(ex, ey - 2, 1, 5, '#3f7a24'); }
    if (st === 'heal') { var hx = r.x + r.w / 2, hy = r.y - 9 + bob; R(hx - 2, hy - 3, 5, 9, '#f08a24'); R(hx, hy - 2, 1, 4, '#fff'); R(hx, hy + 3, 1, 1, '#fff'); }
  });
}

/* ---------- 공통 ---------- */
var gTab = 'field', gSel = 0;
function GC() { return CF.GARDEN; }
function cropNm(k) { return (GC().CROPS[k] || {}).name || k; }
function shuf(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function ecoTag(eco) { return eco ? '<span class="gtag e">친환경</span>' : '<span class="gtag n">일반</span>'; }
function markOf(k) { var d = state.g.dex[k], m = GC().MARKS; if (!d) return 0; return d.e >= m[1] ? 2 : d.e >= m[0] ? 1 : 0; }
function markTag(m) { return m === 2 ? '<span class="gtag m2">🌿 유기농</span>' : m === 1 ? '<span class="gtag m1">🟢 무농약</span>' : ''; }
function favNames(k) { return (GC().CROPS[k].fav || []).map(function (t) { return nm(t); }).join(', '); }
function buddyNear(i) {
  var P = state.g.plots, pl = P[i], C = GC().CROPS[pl.c]; if (!C) return false;
  return [P[i - 1], P[i + 1]].some(function (q) {
    if (!q || !q.c || q.st === 'tired' || q.st === 'heal') return false;
    return C.buddy ? q.c === C.buddy : (GC().CROPS[q.c].buddy === pl.c);
  });
}
function invCount() { var n = 0; Object.keys(state.g.inv).forEach(function (k) { n += state.g.inv[k]; }); return n; }

function openGarden(i) {
  hideMenu();
  if (typeof i === 'number') gSel = i;
  gTab = 'field';
  renderGarden();
